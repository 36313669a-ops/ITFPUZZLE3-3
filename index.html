
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北觀拼圖大挑戰｜3×3</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  font-family: "Microsoft JhengHei", sans-serif;
  color: #173d5d;
  background: linear-gradient(135deg, #eaf6ff, #dcecf8);
}

header {
  text-align: center;
  margin-bottom: 18px;
}

h1 {
  margin: 8px 0;
  font-size: clamp(26px, 4vw, 38px);
  letter-spacing: 2px;
}

.subtitle {
  color: #607d94;
  font-size: 14px;
}

.toolbar {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

.info {
  padding: 10px 15px;
  background: white;
  border-radius: 25px;
  font-weight: bold;
}

#timer {
  color: #2378b8;
  font-variant-numeric: tabular-nums;
}

#timer.urgent {
  color: #e53935;
}

button {
  border: 0;
  border-radius: 25px;
  padding: 11px 19px;
  color: white;
  background: #2378b8;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.08);
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, .85fr);
  gap: 18px;
  max-width: 1100px;
  margin: auto;
}

.panel {
  min-width: 0;
  padding: 16px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 6px 24px #183c5812;
}

h2 {
  font-size: 18px;
  margin: 0 0 12px;
}

/* 左側 3×3 九宮格 */
.board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 4px;
  width: 100%;
  aspect-ratio: 1 / 1;
  padding: 4px;
  background: #c9dce9;
  border-radius: 8px;
}

.slot {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 2px dashed #a7c4d9;
  background-color: #f4f9fc;
  touch-action: none;
}

/* 已固定及正確拼圖 */
.slot.fixed,
.slot.correct {
  border: 2px solid #39a875;
}

/* 只有放錯後才出現紅框 */
.slot.wrong {
  border: 3px solid #e53935 !important;
  animation: shake .2s;
}

@keyframes shake {
  25% { transform: translateX(-2px); }
  75% { transform: translateX(2px); }
}

/* CSS 背景切片，不使用 Canvas */
.sprite {
  width: 100%;
  height: 100%;
  background-repeat: no-repeat;
  pointer-events: none;
}

/* 右側拼圖片選取區 */
.pieces {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
}

.piece {
  position: relative;
  min-width: 0;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border: 2px solid #d1e2ef;
  border-radius: 7px;
  background: #edf6fc;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.piece.dragging {
  opacity: .25;
}

.number {
  position: absolute;
  top: 4px;
  left: 4px;
  z-index: 1;
  padding: 2px 5px;
  color: white;
  background: #173d5ddd;
  border-radius: 4px;
  font-size: 11px;
  pointer-events: none;
}

.fixed-tag {
  position: absolute;
  top: 3px;
  left: 3px;
  z-index: 1;
  padding: 2px 4px;
  color: white;
  background: #20885b;
  border-radius: 4px;
  font-size: 10px;
  pointer-events: none;
}

/* 拖曳時跟隨游標的拼圖 */
.drag-ghost {
  position: fixed;
  z-index: 9999;
  pointer-events: none;
  opacity: .95;
  border: 2px solid #2378b8;
  border-radius: 6px;
  box-shadow: 0 8px 22px #12334c55;
  transform: scale(1.04);
  overflow: hidden;
}

.status {
  min-height: 42px;
  margin-top: 12px;
  padding: 12px;
  border-radius: 9px;
  background: #edf6fc;
  font-size: 14px;
  line-height: 1.6;
}

.status.error {
  color: #c62828;
  background: #fff0f0;
}

.status.success {
  color: #16784c;
  background: #e6f7ed;
}

/* 最後十秒的原圖提示 */
.preview {
  display: none;
  margin-bottom: 12px;
  padding: 10px;
  background: #fff4d9;
  border-radius: 10px;
}

.preview.show {
  display: block;
}

.preview p {
  margin: 0 0 8px;
  color: #805b15;
  font-size: 13px;
  font-weight: bold;
}

.preview img {
  display: block;
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  border-radius: 6px;
}

.instructions {
  color: #607d94;
  font-size: 13px;
  line-height: 1.8;
}

/* 遊戲結果 */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10000;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #102d48aa;
}

#overlay.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 420px;
  padding: 28px;
  text-align: center;
  background: white;
  border-radius: 20px;
}

.modal h2 {
  font-size: 28px;
}

.modal p {
  color: #607d94;
  line-height: 1.8;
}

@media (max-width: 700px) {
  body {
    padding: 12px;
  }

  .layout {
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
  }

  .panel {
    padding: 12px;
  }

  .board {
    gap: 3px;
    padding: 3px;
  }

  .pieces {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 7px;
  }

  .toolbar {
    gap: 8px;
  }
}
</style>
</head>

<body>

<header>
  <h1>北觀拼圖大挑戰</h1>
  <p class="subtitle">九宮格拼圖｜30 秒挑戰！</p>
</header>

<div class="toolbar">
  <div class="info">
    ⏱ 剩餘時間：<span id="timer">00:30</span>
  </div>

  <div class="info">
    🧩 完成：<span id="progress">4 / 9</span>
  </div>

  <button id="startBtn">開始挑戰</button>
  <button id="resetBtn">重新開始</button>
</div>

<main class="layout">

  <section class="panel">
    <h2>拼圖區｜3 × 3</h2>

    <div id="preview" class="preview">
      <p>💡 剩下 10 秒！參考完整原圖</p>
      <img id="previewImg" alt="完整拼圖原圖">
    </div>

    <div id="board" class="board"></div>

    <div id="status" class="status">
      請按下「開始挑戰」，將右側拼圖片拖到正確位置。
    </div>
  </section>

  <section class="panel">
    <h2>選取區｜拖曳拼圖片</h2>

    <div id="pieces" class="pieces"></div>

    <p class="instructions">
      電腦：使用滑鼠拖曳拼圖。<br>
      手機：使用手指拖曳拼圖。<br>
      拖曳時拼圖會跟著游標移動。<br>
      放錯位置才會出現紅框。<br>
      綠色拼圖為已固定或已完成的區塊。
    </p>
  </section>

</main>

<div id="overlay">
  <div class="modal">
    <h2 id="resultTitle">挑戰完成！</h2>
    <p id="resultText"></p>
    <button id="againBtn">再玩一次</button>
  </div>
</div>

<script>
"use strict";

/* ==========================
   遊戲設定
========================== */

const IMAGE_FILES = [
  "01.jpg",
  "02.jpg",
  "03.jpg",
  "04.jpg"
];

const ROWS = 3;
const COLS = 3;
const TOTAL = ROWS * COLS;
const GAME_SECONDS = 30;
const FIXED_COUNT = 4;

/* ==========================
   遊戲狀態
========================== */

const board = document.getElementById("board");
const piecesBox = document.getElementById("pieces");
const timerText = document.getElementById("timer");
const progressText = document.getElementById("progress");
const statusBox = document.getElementById("status");
const previewBox = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");
const overlay = document.getElementById("overlay");

let currentImage = "";
let fixed = new Set();
let solved = new Set();

let seconds = GAME_SECONDS;
let timerId = null;
let running = false;
let ended = false;
let startPending = false;

let dragState = null;
let dragGhost = null;
let lastWrongSlot = null;
let wrongTimeout = null;

/* ==========================
   共用函式
========================== */

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function setStatus(message, type = "") {
  statusBox.textContent = message;
  statusBox.className = "status" + (type ? " " + type : "");
}

function updateProgress() {
  progressText.textContent = solved.size + " / " + TOTAL;
}

function updateTimer() {
  timerText.textContent =
    "00:" + String(Math.max(0, seconds)).padStart(2, "0");

  timerText.classList.toggle("urgent", seconds <= 5);
}

/* ==========================
   隨機載入 01.jpg～04.jpg
========================== */

function loadRandomImage() {
  return new Promise((resolve, reject) => {
    const candidates = shuffle([...IMAGE_FILES]);
    let position = 0;

    function tryNext() {
      if (position >= candidates.length) {
        reject(new Error(
          "找不到可用圖片，請確認 01.jpg、02.jpg、03.jpg、04.jpg 與 HTML 位於同一資料夾。"
        ));
        return;
      }

      const filename = candidates[position++];
      const img = new Image();

      img.onload = () => {
        currentImage = filename;
        resolve();
      };

      img.onerror = () => {
        tryNext();
      };

      img.src = filename;
    }

    tryNext();
  });
}

/* ==========================
   切出 3×3 拼圖片段
   不使用 Canvas / toDataURL
========================== */

function setSlice(element, index) {
  const row = Math.floor(index / COLS);
  const col = index % COLS;

  const x = col / (COLS - 1) * 100;
  const y = row / (ROWS - 1) * 100;

  element.classList.add("sprite");

  element.style.backgroundImage =
    'url("' + currentImage + '")';

  element.style.backgroundSize =
    (COLS * 100) + "% " + (ROWS * 100) + "%";

  element.style.backgroundPosition =
    x + "% " + y + "%";
}

/* ==========================
   建立左側拼圖盤
========================== */

function buildBoard() {
  board.innerHTML = "";

  fixed = new Set(
    shuffle([...Array(TOTAL).keys()]).slice(0, FIXED_COUNT)
  );

  solved = new Set(fixed);

  for (let i = 0; i < TOTAL; i++) {
    const slot = document.createElement("div");

    slot.className = "slot";
    slot.dataset.index = i;

    if (fixed.has(i)) {
      slot.classList.add("fixed", "correct");
      setSlice(slot, i);

      const tag = document.createElement("span");
      tag.className = "fixed-tag";
      tag.textContent = "已固定";

      slot.appendChild(tag);
    }

    board.appendChild(slot);
  }
}

/* ==========================
   建立右側拼圖選取區
========================== */

function buildPieces() {
  piecesBox.innerHTML = "";

  const available = shuffle(
    [...Array(TOTAL).keys()].filter(i => !fixed.has(i))
  );

  available.forEach(index => {
    const piece = document.createElement("div");

    piece.className = "piece";
    piece.dataset.index = index;

    const sprite = document.createElement("div");
    setSlice(sprite, index);

    const number = document.createElement("span");
    number.className = "number";
    number.textContent = index + 1;

    piece.append(sprite, number);
    piecesBox.appendChild(piece);

    piece.addEventListener("pointerdown", event => {
      if (!running || ended || startPending || dragState) return;

      if (event.pointerType === "mouse" && event.button !== 0) {
        return;
      }

      event.preventDefault();
      beginDrag(piece, index, event);
    });
  });
}

/* ==========================
   開始拖曳
========================== */

function beginDrag(piece, index, event) {
  const rect = piece.getBoundingClientRect();

  dragState = {
    index: index,
    source: piece,
    pointerId: event.pointerId,
    offsetX: event.clientX - rect.left,
    offsetY: event.clientY - rect.top,
    width: rect.width,
    height: rect.height
  };

  piece.classList.add("dragging");

  // 建立跟隨手指或滑鼠的拼圖
  dragGhost = document.createElement("div");

  dragGhost.className = "drag-ghost";
  dragGhost.style.width = rect.width + "px";
  dragGhost.style.height = rect.height + "px";

  setSlice(dragGhost, index);
  document.body.appendChild(dragGhost);

  moveGhost(event.clientX, event.clientY);

  document.addEventListener("pointermove", onPointerMove, {
    passive: false
  });

  document.addEventListener("pointerup", onPointerUp);
  document.addEventListener("pointercancel", onPointerCancel);
}

/* ==========================
   移動浮動拼圖
========================== */

function moveGhost(clientX, clientY) {
  if (!dragState || !dragGhost) return;

  dragGhost.style.left =
    (clientX - dragState.offsetX) + "px";

  dragGhost.style.top =
    (clientY - dragState.offsetY) + "px";
}

function onPointerMove(event) {
  if (!dragState) return;
  if (event.pointerId !== dragState.pointerId) return;

  event.preventDefault();

  moveGhost(event.clientX, event.clientY);
}

/* ==========================
   結束拖曳
========================== */

function onPointerUp(event) {
  if (!dragState) return;
  if (event.pointerId !== dragState.pointerId) return;

  const index = dragState.index;

  // 隱藏浮動拼圖，以便判斷下方圖框
  if (dragGhost) {
    dragGhost.style.display = "none";
  }

  const target = document.elementFromPoint(
    event.clientX,
    event.clientY
  );

  const slot = target ? target.closest(".slot") : null;

  finishDrag();

  if (!running || ended) return;

  // 放在拼圖盤以外，不顯示錯誤
  if (!slot || !board.contains(slot)) return;

  const slotIndex = Number(slot.dataset.index);

  if (
    slotIndex !== index ||
    fixed.has(slotIndex) ||
    solved.has(slotIndex)
  ) {
    showWrongSlot(slot);
    return;
  }

  placePiece(index, slotIndex);
}

function onPointerCancel(event) {
  if (dragState && event.pointerId !== dragState.pointerId) return;
  finishDrag();
}

function finishDrag() {
  if (dragState && dragState.source) {
    dragState.source.classList.remove("dragging");
  }

  if (dragGhost) {
    dragGhost.remove();
    dragGhost = null;
  }

  dragState = null;

  document.removeEventListener("pointermove", onPointerMove);
  document.removeEventListener("pointerup", onPointerUp);
  document.removeEventListener("pointercancel", onPointerCancel);
}

/* ==========================
   錯誤紅框
========================== */

function showWrongSlot(slot) {
  if (lastWrongSlot) {
    lastWrongSlot.classList.remove("wrong");
  }

  clearTimeout(wrongTimeout);

  slot.classList.remove("wrong");
  void slot.offsetWidth;
  slot.classList.add("wrong");

  lastWrongSlot = slot;

  setStatus("位置不正確！請再試一次。", "error");

  wrongTimeout = setTimeout(() => {
    slot.classList.remove("wrong");

    if (lastWrongSlot === slot) {
      lastWrongSlot = null;
    }
  }, 800);
}

/* ==========================
   放置拼圖
========================== */

function placePiece(pieceIndex, slotIndex) {
  if (!running || ended || solved.has(pieceIndex)) return;

  const slot = board.children[slotIndex];

  if (
    slotIndex !== pieceIndex ||
    fixed.has(slotIndex) ||
    solved.has(slotIndex)
  ) {
    showWrongSlot(slot);
    return;
  }

  solved.add(pieceIndex);

  slot.classList.add("correct");
  setSlice(slot, pieceIndex);

  const piece = piecesBox.querySelector(
    '.piece[data-index="' + pieceIndex + '"]'
  );

  if (piece) piece.remove();

  updateProgress();
  setStatus("答對了！繼續完成其他拼圖。");

  if (solved.size === TOTAL) {
    finishGame(true);
  }
}

/* ==========================
   倒數計時
========================== */

function startTimer() {
  clearInterval(timerId);

  timerId = setInterval(() => {
    if (!running || ended) return;

    seconds--;
    updateTimer();

    if (seconds <= 10 && solved.size < TOTAL) {
      previewBox.classList.add("show");
    }

    if (seconds <= 0) {
      finishGame(false);
    }
  }, 1000);
}

/* ==========================
   遊戲結束
========================== */

function finishGame(win) {
  if (ended) return;

  ended = true;
  running = false;

  clearInterval(timerId);
  finishDrag();

  if (win) {
    setStatus("太棒了！成功完成全部 9 片拼圖！", "success");

    document.getElementById("resultTitle").textContent =
      "挑戰成功！";

    document.getElementById("resultText").textContent =
      "恭喜你完成北觀拼圖大挑戰！";
  } else {
    previewBox.classList.add("show");

    setStatus("時間到！再挑戰一次吧。", "error");

    document.getElementById("resultTitle").textContent =
      "時間到！";

    document.getElementById("resultText").textContent =
      "你完成了 " + solved.size + " / " + TOTAL +
      " 片拼圖，再試一次吧！";
  }

  overlay.classList.add("show");
}

/* ==========================
   開始／重新開始
========================== */

async function startGame() {
  if (startPending) return;

  startPending = true;
  running = false;
  ended = false;

  clearInterval(timerId);
  clearTimeout(wrongTimeout);
  finishDrag();

  seconds = GAME_SECONDS;
  updateTimer();

  overlay.classList.remove("show");
  previewBox.classList.remove("show");

  setStatus("正在載入隨機拼圖圖片……");

  document.getElementById("startBtn").disabled = true;
  document.getElementById("resetBtn").disabled = true;
  document.getElementById("againBtn").disabled = true;

  try {
    await loadRandomImage();

    previewImg.src = currentImage;

    buildBoard();
    buildPieces();
    updateProgress();

    running = true;

    setStatus("挑戰開始！將右側拼圖片拖曳至正確位置。");

    startTimer();
  } catch (error) {
    setStatus(error.message, "error");
  } finally {
    startPending = false;

    document.getElementById("startBtn").disabled = false;
    document.getElementById("resetBtn").disabled = false;
    document.getElementById("againBtn").disabled = false;
  }
}

/* ==========================
   初始畫面
========================== */

async function init() {
  setStatus("正在載入拼圖圖片……");

  try {
    await loadRandomImage();

    previewImg.src = currentImage;

    buildBoard();
    buildPieces();
    updateProgress();

    setStatus("準備好了！按下「開始挑戰」開始 30 秒倒數。");
  } catch (error) {
    setStatus(error.message, "error");
  }
}

document.getElementById("startBtn").addEventListener(
  "click", startGame
);

document.getElementById("resetBtn").addEventListener(
  "click", startGame
);

document.getElementById("againBtn").addEventListener(
  "click", startGame
);

init();
</script>

</body>
</html>
